<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>نشرة وحدة عناية القلب</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&family=Noto+Nastaliq+Urdu:wght@400;600;700&family=Hind:wght@400;500;600;700&display=swap">
<style>
/* Layout: one reading column; hero splits text | ward photo; sections follow the printed leaflet's order and colour roles */
:root{
  --bg:#f6f9fd; --surface:#ffffff; --tint:#e8f0fa; --tint-2:#dde9f6;
  --fg:#14202e; --muted:#4f5f72; --line:#d3deeb;
  --blue:#005eb8; --sky:#41b6e6; --teal:#00a499; --teal-ink:#006b62; --teal-tint:#e4f4f2;
  --red:#b01a10; --red-dot:#da291c; --red-tint:#fbeaea;
  --amber:#8a5200; --amber-edge:#ee8a00; --amber-tint:#fff6e3;
  --navy:#003087; --bar:#005eb8; --on-bar:#ffffff;
  --font:"Tajawal",system-ui,sans-serif; --lh:1.75; --scale:1;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c1622; --surface:#122133; --tint:#16283d; --tint-2:#1b3049;
  --fg:#e5edf7; --muted:#a3b3c6; --line:#24384f;
  --blue:#6cb2f5; --sky:#5ec6f0; --teal:#3cc6b8; --teal-ink:#5fd4c7; --teal-tint:#11302f;
  --red:#ff8a80; --red-dot:#ff6b5e; --red-tint:#3a1a1c;
  --amber:#f2b85c; --amber-edge:#ee8a00; --amber-tint:#33270f;
  --navy:#9cc2ff; --bar:#0a4f96; --on-bar:#ffffff; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c1622; --surface:#122133; --tint:#16283d; --tint-2:#1b3049;
  --fg:#e5edf7; --muted:#a3b3c6; --line:#24384f;
  --blue:#6cb2f5; --sky:#5ec6f0; --teal:#3cc6b8; --teal-ink:#5fd4c7; --teal-tint:#11302f;
  --red:#ff8a80; --red-dot:#ff6b5e; --red-tint:#3a1a1c;
  --amber:#f2b85c; --amber-edge:#ee8a00; --amber-tint:#33270f;
  --navy:#9cc2ff; --bar:#0a4f96; --on-bar:#ffffff; color-scheme:dark}
html[lang="en"]{--font:"Tajawal",system-ui,sans-serif; --lh:1.6}
html[lang="hi"]{--font:"Hind","Noto Sans Devanagari",system-ui,sans-serif; --lh:1.7}
html[lang="ur"]{--font:"Noto Nastaliq Urdu","Jameel Noori Nastaleeq",serif; --lh:2.25; --scale:.94}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:calc(17px*var(--scale));line-height:var(--lh);margin:0}
.wrap{max-width:980px;margin-inline:auto;padding-inline:20px}
h1,h2,h3{text-wrap:balance;margin:0;line-height:1.35}
html[lang="ur"] h1,html[lang="ur"] h2,html[lang="ur"] h3{line-height:1.9}
p{margin:0}
a{color:inherit}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px;border-radius:6px}

/* top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:44px;height:50px;object-fit:contain;background:#fff;border-radius:10px;padding:2px}
.brand span{font-size:.82em;color:var(--blue);font-weight:500;line-height:1.4}
.langs{display:flex;gap:4px;padding:4px;background:var(--tint);border-radius:999px;font-family:"Tajawal",system-ui,sans-serif}
.langs button{font:inherit;font-size:15px;border:0;background:transparent;color:var(--blue);padding:6px 14px;border-radius:999px;cursor:pointer;line-height:1.4;min-height:36px}
.langs button[lang="ur"]{font-family:"Noto Nastaliq Urdu",serif;font-size:14px;line-height:1.2}
.langs button[lang="hi"]{font-family:"Hind",sans-serif}
.langs button:hover{background:var(--tint-2)}
.langs button[aria-pressed="true"]{background:var(--blue);color:var(--surface);font-weight:700}

/* hero */
.hero{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr);gap:32px;align-items:center;padding-block:36px 28px}
.hero .dept{color:var(--sky);font-weight:500;font-size:.9em}
.hero h1{color:var(--blue);font-weight:800;font-size:clamp(1.9rem,4.6vw,2.7rem);margin-block:8px 6px}
html[lang="hi"] .hero h1{font-weight:700}
.hero .sub{display:flex;align-items:center;gap:10px;color:var(--teal);font-weight:500;font-size:.9em}
.hero .sub::after{content:"";height:3px;flex:0 0 72px;border-radius:3px;background:var(--sky)}
.hero .intro{display:grid;gap:14px;margin-top:22px;max-width:62ch}
.hero .tag{color:var(--blue);font-weight:500}
.photo{position:relative;max-width:100%;aspect-ratio:3/4;border-radius:28px;overflow:hidden;background:var(--tint)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.photo{border-inline-start:10px solid var(--blue);border-start-start-radius:140px 50%;border-end-start-radius:140px 50%}

/* contents */
.toc{background:var(--tint);border-radius:22px;padding:22px 24px;margin-block:8px 12px}
.toc h2{color:var(--blue);font-size:1.25em;margin-bottom:10px}
.toc ol{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.toc a{display:flex;align-items:center;gap:12px;text-decoration:none;padding:6px 8px;border-radius:10px}
.toc a:hover{background:var(--tint-2)}
.dot{flex:0 0 11px;height:11px;border-radius:50%;background:var(--teal)}

/* sections */
section{padding-block:26px}
.sec-h{display:flex;align-items:center;gap:10px;color:var(--blue);font-size:1.5em;font-weight:700;margin-bottom:16px;scroll-margin-top:90px}
.sec-h::before{content:"";flex:0 0 5px;align-self:stretch;min-height:1.1em;border-radius:3px;background:var(--sky)}
.panel{background:var(--tint);border-radius:18px;padding:18px 22px}
.panel + .panel{margin-top:12px}
.note{display:flex;gap:16px;align-items:center;background:var(--tint-2)}
.note svg{flex:0 0 46px}
.note p{min-width:0}
.ico{fill:none;stroke:var(--blue);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ico-bg{fill:var(--surface)}

.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.card{background:var(--tint);border-radius:16px;padding:18px 14px;text-align:center;display:grid;justify-items:center;gap:10px;align-content:start;color:var(--blue);font-size:.92em;line-height:1.55}
html[lang="ur"] .card{line-height:2}

ul.list{list-style:none;margin:0;padding:0;display:grid;gap:12px}
ul.list li{display:flex;gap:12px;align-items:flex-start}
ul.list li .dot{margin-top:calc(.5em*var(--lh) - 5px)}
.red .dot{background:var(--red-dot)}

.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;margin-top:22px}
.callout{border-radius:18px;padding:20px 22px;border-inline-start:6px solid}
.callout h3{font-size:1.1em;font-weight:700;margin-bottom:10px}
.callout.help{background:var(--amber-tint);border-color:var(--amber-edge)}
.callout.help h3{color:var(--amber)}
.callout.red{background:var(--red-tint);border-color:var(--red-dot)}
.callout.red h3{color:var(--red)}

.family{background:var(--teal-tint);border-radius:20px;padding:22px;border-inline-start:6px solid var(--teal);display:grid;gap:12px}
.family h3{color:var(--teal-ink);font-size:1.15em}
.timebox{background:var(--surface);border:1.5px solid var(--teal);border-radius:16px;padding:16px;text-align:center;display:grid;gap:4px}
.timebox .days{color:var(--muted);font-size:.92em}
.timebox .time{color:var(--teal);font-weight:800;font-size:clamp(1.5rem,4vw,2rem);font-variant-numeric:tabular-nums;line-height:1.5}
html[lang="ur"] .timebox .time{font-weight:700;line-height:2}

.followup{background:var(--tint);border-radius:20px;padding:22px;border-inline-start:6px solid var(--blue);display:grid;gap:14px}
.followup h3{color:var(--navy);font-size:1.1em}
.big{background:var(--surface);border:1.5px solid var(--blue);border-radius:16px;padding:16px;text-align:center;color:var(--blue);font-weight:800;font-size:clamp(1.3rem,3.6vw,1.75rem);line-height:1.5}
html[lang="ur"] .big{font-weight:700;line-height:2}
.datefield{display:flex;flex-wrap:wrap;align-items:center;gap:10px;color:var(--muted)}
.datefield input{font:inherit;font-family:"Tajawal",system-ui,sans-serif;font-size:16px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);min-height:44px}
.datefield small{flex-basis:100%;font-size:.8em}

.er{margin-top:16px}
footer{background:var(--bar);color:var(--on-bar);margin-top:28px}
footer .wrap{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding-block:18px}
footer a{font-size:.9em}

@media (max-width:760px){
  .hero{grid-template-columns:minmax(0,1fr);gap:22px;padding-block:22px}
  .photo{aspect-ratio:16/10;order:-1;border-radius:20px}
  .photo{border-inline-start:0;border-radius:20px}
  .cards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .pair{grid-template-columns:minmax(0,1fr)}
  .brand span{font-size:.75em}
}
@media (max-width:420px){ .langs button{padding:6px 10px} .brand span{display:none} }
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
html{scroll-behavior:smooth}
</style>

  clock:'<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle class="ico-bg" cx="23" cy="23" r="23"/><circle class="ico" cx="23" cy="16" r="5"/><path class="ico" d="M13 35c0-6 4.5-10 10-10s10 4 10 10"/><circle class="ico" cx="32" cy="12" r="5"/><path class="ico" d="M32 9.5V12l1.8 1.2"/></svg>',
  nurse:'<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle class="ico-bg" cx="23" cy="23" r="23"/><path class="ico" d="M17 12h12v5a6 6 0 0 1-12 0z"/><path class="ico" d="M23 13.5v3M21.5 15h3M13 35c0-6 4.5-10 10-10s10 4 10 10"/></svg>',
  team:'<svg width="46" height="46" viewBox="0 0 46 46" aria-hidden="true"><circle class="ico-bg" cx="23" cy="23" r="23"/><circle class="ico" cx="18" cy="17" r="4"/><circle class="ico" cx="29" cy="18" r="3.4"/><path class="ico" d="M10 33c0-5 3.6-8 8-8s8 3 8 8M27 25c3.6 0 7 2.4 7 7"/><path class="ico" d="M33 11v5M30.5 13.5h5"/></svg>'
};
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const li = (arr, cls='') => `<ul class="list ${cls}">${arr.map(x => `<li><span class="dot"></span><span>${esc(x)}</span></li>`).join('')}</ul>`;
const KEY = 'ccu-leaflet-date';
function store(k, v){ try{ if(v===undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

function render(l){
  const t = D[l], u = D.ui[l];
  const html = document.documentElement;
  html.lang = l; html.dir = (l==='ar'||l==='ur') ? 'rtl' : 'ltr';
  document.title = t.unit;
  document.getElementById('b-name').textContent = t.dept;
  document.getElementById('f-name').textContent = t.footer;
  document.getElementById('f-top').textContent = u.top;
  document.getElementById('langs').setAttribute('aria-label', u.lang);
  document.querySelectorAll('#langs button').forEach(b => b.setAttribute('aria-pressed', b.dataset.l===l));
  const tocIds = ['why','expect','safety','family','discharge'];
  document.getElementById('app').innerHTML = `
  <div class="hero" id="top">
    <div>
      <div class="dept">${esc(t.dept)}</div>
      <h1>${t.title}</h1>
      <div class="sub">${esc(t.subtitle)}</div>
      <div class="intro"><p>${esc(t.p1)}</p><p>${esc(t.p2)}</p><p class="tag">${esc(t.tag)}</p></div>
    </div>
    <figure class="photo" style="margin:0"><img src="${PHOTO}" alt=""></figure>
  </div>
  <nav class="toc" aria-labelledby="toc-h">
    <h2 id="toc-h">${esc(t.toc_h)}</h2>
    <ol>${t.toc.map((x,i)=>`<li><a href="#${tocIds[i]}"><span class="dot"></span><span>${esc(x)}</span></a></li>`).join('')}</ol>
  </nav>

  <section>
    <h2 class="sec-h" id="why">${esc(t.why_h)}</h2>
    <div class="panel"><p>${esc(t.why)}</p></div>
    <div class="panel note">${ICONS.monitor}<p>${esc(t.mon)}</p></div>
  </section>

  <section>
    <h2 class="sec-h">${esc(t.who_h)}</h2>
    <div class="cards">${t.cards.map((x,i)=>`<div class="card">${[ICONS.doctor,ICONS.clock,ICONS.nurse,ICONS.team][i]}<span>${esc(x)}</span></div>`).join('')}</div>
  </section>

  <section>
    <h2 class="sec-h" id="expect">${esc(t.exp_h)}</h2>
    ${li(t.exp)}
    <div class="pair">
      <div class="callout help"><h3>${esc(t.help_h)}</h3><p>${esc(t.help)}</p></div>
      <div class="callout red"><h3>${esc(t.red_h)}</h3>${li(t.red,'red')}</div>
    </div>
  </section>

  <section>
    <h2 class="sec-h" id="safety">${esc(t.saf_h)}</h2>
    <div class="panel">${li(t.saf)}</div>
  </section>

  <section>
    <h2 class="sec-h">${esc(t.med_h)}</h2>
    <div class="panel" style="background:var(--tint-2)"><p>${esc(t.med)}</p></div>
  </section>

  <section>
    <h2 class="sec-h" id="family">${esc(t.fam_h)}</h2>
    <div class="family">
      <h3>${esc(t.con_h)}</h3>
      <p>${esc(t.con)}</p>
      <div class="timebox"><span class="days">${esc(t.days)}</span><span class="time" dir="auto">${esc(t.time)}</span></div>
      <p>${esc(t.out)}</p>
    </div>
    <div style="margin-top:18px">${li(t.fam)}</div>
  </section>

  <section>
    <h2 class="sec-h" id="discharge">${esc(t.bef_h)}</h2>
    ${li(t.bef)}
    <div class="followup" style="margin-top:20px">
      <h3>${esc(t.fu_h)}</h3>
      <div class="big">${esc(t.fu_big)}</div>
      <p>${esc(t.fu)}</p>
      <label class="datefield" for="appt"><span>${esc(t.fu_lbl)}</span><input type="date" id="appt"><small>${esc(u.saved)}</small></label>
    </div>
    <div class="callout red er"><h3>${esc(t.er_h)}</h3>${li(t.er,'red')}</div>
  </section>

  <section>
    <h2 class="sec-h">${esc(t.st_h)}</h2>
    ${li(t.st)}
  </section>`;
  const inp = document.getElementById('appt');
  inp.value = store(KEY) || '';
  inp.addEventListener('change', () => store(KEY, inp.value));
  store('ccu-leaflet-lang', l);
}

const LANGS = ['ar','en','ur','hi'];
document.getElementById('langs').addEventListener('click', e => {
  const b = e.target.closest('button'); if(!b) return;
  render(b.dataset.l);
  try{ history.replaceState(null, '', '#' + b.dataset.l); }catch(err){}
  window.scrollTo({top:0});
});
const fromHash = location.hash.replace('#','');
render(LANGS.includes(fromHash) ? fromHash : (LANGS.includes(store('ccu-leaflet-lang')) ? store('ccu-leaflet-lang') : 'ar'));
</script>

</body></html>
